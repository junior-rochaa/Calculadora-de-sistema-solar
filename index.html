<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimensionamento Solar Pro</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="shortcut icon" type="image/x-icon" href="logo.png">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <button type="button" class="theme-toggle" title="Alternar Tema">
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        </button>

        <div class="header">
            <h2>Dimensionamento Solar</h2>
            <p>Calculadora Fotovoltaica baseada em dados NASA POWER</p>
        </div>
        
        <form>
            <div class="form-grid">
                <div class="form-group">
                    <label for="estado">Estado</label>
                    <select id="estado" required autofocus>
                        <option value="">UF</option>
                    </select>
                </div>
                
                <div class="form-group autocomplete-container">
                    <label for="cidade">Cidade</label>
                    <div class="input-wrapper">
                        <input type="text" id="cidadeHint" class="input-shared" disabled autocomplete="off">
                        <input type="text" id="cidade" class="input-shared" placeholder="Aguarde o Estado" autocomplete="off" required disabled>
                    </div>
                    <ul id="listaCidades" class="autocomplete-list"></ul>
                </div>
            </div>

            <div class="form-grid equal">
                <div class="form-group">
                    <label for="consumo">Consumo Mês (kWh)</label>
                    <input type="number" id="consumo" placeholder="Ex: 400" min="1" required>
                </div>

                <div class="form-group">
                    <label for="potenciaPlaca">Potência Módulo (W)</label>
                    <input type="number" id="potenciaPlaca" value="550" min="1" required>
                </div>
            </div>

            <button type="submit" id="btnConsultar">
                Dimensionar Sistema
            </button>
        </form>

        <div id="loading"><div class="spinner"></div> Processando dados climáticos...</div>

        <div id="resultado">
            <div class="dashboard-grid">
                <div class="dash-card featured">
                    <div class="card-header"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg> Capacidade do Sistema</div>
                    <div class="card-value" id="resPotenciaKwp">-</div>
                </div>
                <div class="dash-card featured">
                    <div class="card-header"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="3" y1="15" x2="21" y2="15"></line><line x1="9" y1="3" x2="9" y2="21"></line><line x1="15" y1="3" x2="15" y2="21"></line></svg> Módulos Necessários</div>
                    <div class="card-value" id="resQtdPlacas">-</div>
                </div>
                <div class="dash-card">
                    <div class="card-header"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect><rect x="9" y="9" width="6" height="6"></rect><line x1="9" y1="1" x2="9" y2="4"></line><line x1="15" y1="1" x2="15" y2="4"></line><line x1="9" y1="20" x2="9" y2="23"></line><line x1="15" y1="20" x2="15" y2="23"></line><line x1="20" y1="9" x2="23" y2="9"></line><line x1="20" y1="14" x2="23" y2="14"></line><line x1="1" y1="9" x2="4" y2="9"></line><line x1="1" y1="14" x2="4" y2="14"></line></svg> Inversor Recomendado</div>
                    <div class="card-value card-value-small" id="resInversor">-</div>
                </div>
                <div class="dash-card warning">
                    <div class="card-header"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg> HSP (NASA Power)</div>
                    <div class="card-value"><span id="mediaAnual">-</span> <span class="card-unit">kWh/m²</span></div>
                </div>
            </div>
            <!-- Substitua a div .coords por este bloco -->
            <div class="location-actions">
                <div class="coords">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                    <span id="coords">-</span>
                </div>
                
                <!-- Novo botão do Google Maps -->
                <a id="linkMaps" href="#" target="_blank" class="btn-maps">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"></polygon><line x1="9" y1="3" x2="9" y2="21"></line><line x1="15" y1="3" x2="15" y2="21"></line></svg>
                    Abrir no Google Maps
                </a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
